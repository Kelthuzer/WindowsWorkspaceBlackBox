name: Build standalone Windows EXE
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore WindowsWorkspaceBlackBox.slnx
      - name: Build
        run: dotnet build WindowsWorkspaceBlackBox.slnx -c Release --no-restore
      - name: Test recovery invariants
        run: dotnet test tests/WWBB.Tests/WWBB.Tests.csproj -c Release --no-build --logger trx
      - name: Publish self-contained Windows x64
        run: dotnet publish src/WindowsWorkspaceBlackBox/WindowsWorkspaceBlackBox.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/publish
      - name: Verify self-contained EXE integrity
        run: python scripts/verify_bundle.py artifacts/publish/WindowsWorkspaceBlackBox.exe
      - name: EXE checksum
        shell: pwsh
        run: Get-FileHash artifacts/publish/WindowsWorkspaceBlackBox.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: WindowsWorkspaceBlackBox-x64
          path: artifacts/publish/WindowsWorkspaceBlackBox.exe
          if-no-files-found: error
