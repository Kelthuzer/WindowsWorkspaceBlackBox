name: Build Windows app and installer
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore WindowsWorkspaceBlackBox.slnx
      - name: Build
        run: dotnet build WindowsWorkspaceBlackBox.slnx -c Release --no-restore
      - name: Test recovery invariants
        run: dotnet test tests/WWBB.Tests/WWBB.Tests.csproj -c Release --no-build --logger trx
      - name: Publish self-contained Windows x64
        run: dotnet publish src/WindowsWorkspaceBlackBox/WindowsWorkspaceBlackBox.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/publish
      - name: Verify self-contained EXE integrity
        run: python scripts/verify_bundle.py artifacts/publish/WindowsWorkspaceBlackBox.exe
      - name: Build setup EXE
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $compiler)) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          & $compiler installer/WindowsWorkspaceBlackBox.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts/publish/*.exe, artifacts/installer/*.exe | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)"
          } | Set-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WindowsWorkspaceBlackBox-Setup-x64
          path: |
            artifacts/installer/*.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: WindowsWorkspaceBlackBox-Portable-x64
          path: artifacts/publish/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-results
          path: tests/WWBB.Tests/TestResults/
